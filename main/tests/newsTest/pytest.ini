[pytest]
# Pytest Configuration for News Model Tests
# Includes metrics, coverage, and performance tracking

# Django Settings
DJANGO_SETTINGS_MODULE = coda_project.settings

# Test Discovery Patterns
python_files = test_*.py
python_classes = *Tests
python_functions = test_*

# Default Options with Metrics Collection
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --capture=no

# Test Paths (includes subdirectories)
testpaths = 
    main/tests/newsTest/unit_testing
    main/tests/newsTest/integration_testing
    main/tests/newsTest/regression_testing
    main/tests/newsTest/system_testing
    main/tests/newsTest/performance_testing

# Markers for test categorization and filtering
markers =
    unit: Unit tests for individual model components
    integration: Integration tests for model interactions
    regression: Regression tests for behavior preservation
    system: System/workflow tests for end-to-end scenarios
    performance: Performance and optimization tests
    slow: Slow running tests (deselect with '-m "not slow"')
    fast: Fast running tests

# Coverage Options with Detailed Reporting
[coverage:run]
source = main
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */conftest.py
branch = True
parallel = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    except ImportError:

precision = 2
show_missing = True
skip_covered = False
sort = Cover

# Coverage Organization
[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

# Performance Monitoring
[tool:pytest]
# Timeout for slow tests (seconds)
timeout = 60
# Fail on markers that don't exist
strict_markers = True

