{% extends "main/base_templates/base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-lg mt-10">
    <h2 class="text-2xl font-bold mb-6">Edit Scholarship</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit"
            class="bg-blue-600 text-white px-6 py-2 rounded-lg mt-4">
            Save Changes
        </button>
        <a href="{% url 'main:add_scholarship' %}" 
           class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg mt-4 ml-2 hover:bg-gray-300">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
