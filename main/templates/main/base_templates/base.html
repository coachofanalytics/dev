{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="Diaspora County 48 Kenya" />
    <meta property="og:description" content="We are Stronger Together!" />
    <meta property="og:image" content="https://www.diasporacounty48.org/static/main/img/dc48k_logo.png" />
    <meta property="og:url" content="https://www.diasporacounty48.org/" />
    <meta property="og:type" content="website" />

    <title>Diaspora County 48 Kenya</title>

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
      integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Favicon -->
    <link rel="icon" href="{% static 'main/img/favicon.png' %}" type="image/png" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Jost:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
      rel="stylesheet"
    />

    <!-- Local CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'main/css/main.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'main/css/navbar.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'main/css/governance.css' %}" />

    <!-- Line Icons -->
    <link rel="stylesheet" href="https://cdn.lineicons.com/3.0/lineicons.css" />

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

    <!-- Stripe JS -->
    <script src="https://js.stripe.com/v3/"></script>
  </head>

  <body>
    <!-- Navbar -->
    {% include 'main/navbar_templates/navbar.html' %}

    <!-- Main Content and Success Messages -->
{% if messages %}
  <div class="container mt-3">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}

      {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    {% include 'main/footer_templates/new_footer.html' %}

    <!-- Bootstrap & jQuery JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

    <!-- Custom Swiper Script -->
    <script>
      var swiper = new Swiper(".swiper-container", {
        slidesPerView: 1,
        spaceBetween: 30,
        loop: true,
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        on: {
          slideChangeTransitionStart: function () {
            const slides = document.querySelectorAll(".swiper-slide img");
            slides.forEach((slide) => {
              slide.style.opacity = "0.9";
            });
          },
          slideChangeTransitionEnd: function () {
            const slides = document.querySelectorAll(".swiper-slide img");
            slides.forEach((slide) => {
              slide.style.opacity = "1";
              slide.style.transform = "scale(1)";
            });
          },
        },
      });

      $(".nav-btn").click(function () {
        $("#collapsibleNavbar").toggleClass("show");
      });
    </script>
  </body>
</html>
