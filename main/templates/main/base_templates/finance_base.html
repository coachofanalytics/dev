<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finance Dashboard{% endblock %}</title>
    
    {% load static %}
    
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.10.16/css/dataTables.bootstrap4.min.css" rel="stylesheet">
    
    <!-- Optional: Custom Styles -->
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">

    <!-- jQuery JS -->
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.0/js/bootstrap.min.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.10.16/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.16/js/dataTables.bootstrap4.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="row">
            <!-- Navbar or other top elements -->
            <nav class="navbar navbar-default">
                <div class="container-fluid">
                    <div class="navbar-header">
                        <a class="navbar-brand" href="#">Finance Dashboard</a>
                    </div>
                    <ul class="nav navbar-nav">
                        <li><a href="{% url 'finance:overboughtsold_list' %}">Overbought/Sold</a></li>
                        <li><a href="#">Stock Analysis</a></li>
                        <li><a href="#">Reports</a></li>
                    </ul>
                </div>
            </nav>
        </div>

        <div class="row">
            <!-- Content Block -->
            {% block content %}
            <!-- This section will be populated by the content of child templates -->
            {% endblock %}
        </div>
    </div>

    <script>
    $(document).ready(function() {
        // DataTables initialization
        $('#bootstrapdatatable').DataTable({
            "aLengthMenu": [[3, 5, 10, 25, -1], [3, 5, 10, 25, "All"]],
            "iDisplayLength": 3
        });
    });
    </script>
</body>
</html>
