{% extends "main/base_templates/base.html" %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm p-4">
    <h2 class="text-center mb-4">{{ organization.name }}</h2>

    <div class="row mb-3">
      <div class="col-md-4 fw-bold">Contact Email:</div>
      <div class="col-md-8">{{ organization.contact_email }}</div>
    </div>

    <div class="row mb-3">
      <div class="col-md-4 fw-bold">Linked User:</div>
      <div class="col-md-8">{{ organization.linked_profile.username }}</div>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
      <a href="#" class="btn btn-primary">
        <i class="fa fa-pencil"></i> Edit
      </a>
      <a href="#" class="btn btn-danger">
        <i class="fa fa-trash"></i> Delete
      </a>
      <a href="{% url 'main:organization-list' %}" class="btn btn-secondary">
        ← Back to List
      </a>
    </div>
  </div>
</div>
{% endblock %}
