<!DOCTYPE html>
<html>
<head>
    <title>Website Details</title>
</head>
<body>
    <h1>{{ object.company }}</h1>
    <p><strong>App Name:</strong> {{ object.app_name }}</p>
    <p><strong>Page Name:</strong> {{ object.page_name }}</p>
    <p><strong>Uploaded File:</strong>
        {% if object.website_url %}
            <a href="{{ object.website_url.url }}">Download</a>
        {% else %}
            No file uploaded.
        {% endif %}
    </p>
    <p><strong>Created:</strong> {{ object.created_at }}</p>
    <p><strong>Updated:</strong> {{ object.updated_at }}</p>

    <p><a href="{% url 'website-list' %}">Back to list</a></p>
</body>
</html>
