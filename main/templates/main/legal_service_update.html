{% extends "main/base_templates/base.html" %}

{% block content %}

<div class="container mt-4">
{% if legal_service %}
<h2>Update Legal Service</h2>
{% else %}
<h2>Create Legal Service</h2>
{% endif %}

<form method="POST">
{% csrf_token %}
{{ form.as_p }}

<button type="submit" class="btn btn-primary">
Save
</button>

<a href="{% url 'main:legal_service_list' %}" class="btn btn-secondary">
Cancel
</a>
</form>
</div>

{% endblock %}
