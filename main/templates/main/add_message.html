{%extends "main/base_templates/base.html"%}

{% block content %}
<div class="container">
    <h2>Add a Message</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">Save Message</button>
        <a href="{% url 'main:layout' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
