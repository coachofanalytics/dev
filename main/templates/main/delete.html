{% extends "main/base_templates/base.html" %}

{% block title %}Delete Service Category{% endblock %}

{% block content %}
<section class="py-4">
  <div class="container">

    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h4 class="fw-bold text-danger mb-3">Confirm Delete</h4>

        <p>
          Are you sure you want to delete this category?
        </p>

        <ul>
          <li><b>Name:</b> {{ category.name }}</li>
          <li><b>Slug:</b> {{ category.slug }}</li>
        </ul>

        <form method="POST">
          {% csrf_token %}

          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>

            <a href="{% url 'main:servicecategory_detail' category.pk %}" class="btn btn-secondary">
              Cancel
            </a>
          </div>

        </form>

      </div>
    </div>

  </div>
</section>
{% endblock %}
