{% extends "main/base_templates/base.html" %}
{% block content %}

<h3>Are you sure you want to delete this testimonial?</h3>
<p>{{ testimonial.name }}</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="action-btn delete-btn">Yes, Delete</button>
    <a href="{% url 'testimonial_list' %}" class="action-btn detail-btn">Cancel</a>
</form>

{% endblock %}
