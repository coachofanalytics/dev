<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete WCAG</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            width: 500px;
            margin: 80px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 3px 12px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #d63031;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 25px;
            color: #444;
        }

        .details {
            text-align: left;
            margin-bottom: 20px;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 5px;
        }

        .label {
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-delete {
            background: #d63031;
            color: white;
        }

        .btn-cancel {
            background: #636e72;
            color: white;
            text-decoration: none;
            display: inline-block;
            line-height: 30px;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>⚠ Delete WCAG Record</h2>

    <p>Are you sure you want to delete this record? This action cannot be undone.</p>

    <!-- Object Details -->
    <div class="details">
        <p><span class="label">Company:</span> {{ object.company }}</p>
        <p><span class="label">App Name:</span> {{ object.app_name }}</p>
        <p><span class="label">Page Name:</span> {{ object.page_name }}</p>
    </div>

    <!-- Delete Form -->
    <form method="POST">
        {% csrf_token %}

        <div class="buttons">
            <button type="submit" class="btn btn-delete">Yes, Delete</button>

            <a href="{% url 'main:wcag_list' %}" class="btn btn-cancel">
                Cancel
            </a>
        </div>
    </form>
</div>

</body>
</html>
