{% extends "main/base_templates/base.html" %}

{% block content %}
<main class="max-w-2xl mx-auto py-16 px-6">
    <div class="bg-white shadow-lg rounded-lg p-8">
        <h1 class="text-3xl font-extrabold text-red-600 mb-4">Confirm Profile Deletion</h1>
        <p class="text-gray-700 mb-6">
            Are you sure you want to remove your profile <strong>{{ member.full_name }}</strong> from the directory? 
            This action cannot be undone.
        </p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="flex gap-4">
                <a href="{% url 'directory' %}" 
                   class="flex-1 bg-gray-200 text-gray-700 py-3 px-6 rounded-lg hover:bg-gray-300 font-semibold text-center">
                    Cancel
                </a>
                <button type="submit" 
                        class="flex-1 bg-red-600 text-white py-3 px-6 rounded-lg hover:bg-red-700 font-semibold">
                    Yes, Delete Profile
                </button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
