{% extends "main/base_templates/base.html" %}

{% block content %}
<style>
    .form-container {
        max-width: 800px;
        margin: 60px auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .form-header {
        margin-bottom: 30px;
        border-bottom: 2px solid #f1f5f9;
        padding-bottom: 15px;
    }
    .form-group p {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
        color: #1e293b;
        text-transform: uppercase;
        font-size: 0.8rem;
    }
    .form-group input, 
    .form-group textarea, 
    .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s;
    }
    .form-group input:focus {
        border-color: #2563eb;
        outline: none;
    }
    .btn-save {
        background: #2563eb;
        color: white;
        padding: 14px 30px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        font-size: 1rem;
    }
    .btn-cancel {
        color: #64748b;
        text-decoration: none;
        margin-left: 20px;
        font-weight: 600;
    }
</style>

<div class="form-container">
    <div class="form-header">
        <h2 style="font-weight: 800;">✏️ Edit Article</h2>
        <p style="color: #64748b;">Update your content, category, and status.</p>
    </div>

    <form method="post" enctype="multipart/form-data" class="form-group">
        {% csrf_token %}
        
        {{ form.as_p }}

        <div style="margin-top: 40px;">
            <button type="submit" class="btn-save">Save Changes</button>
            <a href="{% url 'news:dashboard' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
