{% extends "main/base_templates/base.html" %}
{% load static %}


{% block content %}
<!-- Hero Section -->
<section class="relative bg-cover bg-center h-[600px]" style="background-image: url('{{ hero_image }}');">
  <div class="absolute inset-0 bg-black bg-opacity-50 flex flex-col justify-center items-center text-center text-white">
    <h1 class="text-5xl font-bold mb-4">{{ hero_title }}</h1>
    <p class="text-xl mb-6">{{ hero_subtitle }}</p>
    <a href="#services" class="bg-red-700 hover:bg-red-800 px-6 py-3 rounded-lg">{{ cta_text }}</a>
  </div>
</section>
{% endblock content %}
