{% include 'main/navbar_templates/home_navbar.html' %}
{% block content %}
<div class="container mt-4">
  <h2>{{ category.name }}</h2>
  <p>{{ category.description }}</p>
  <p><strong>Active:</strong> {{ category.is_active }}</p>
  <p><strong>Featured:</strong> {{ category.is_featured }}</p>

  <a href="{% url 'main:servicecategory_update' category.pk %}" class="btn btn-warning">Edit</a>
  <a href="{% url 'main:servicecategory_delete' category.pk %}" class="btn btn-danger">Delete</a>
  <a href="{% url 'main:servicecategory_list' %}" class="btn btn-secondary">Back</a>
</div>
{% endblock %}
