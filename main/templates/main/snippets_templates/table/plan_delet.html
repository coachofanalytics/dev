{% extends "main/base_templates/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm p-4">
        <h2 class="text-danger mb-3">Delete Membership Plan</h2>
        <p class="lead">Are you sure you want to delete this membership plan?</p>
        <p><strong class="text-dark">{{ membershipplan.name }}</strong></p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'main:MembershipPlan_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
