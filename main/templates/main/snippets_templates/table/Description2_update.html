{% extends "main/base_templates/base.html" %}

{% block content %}
<div class="container my-5">
<div class="row justify-content-center">
<div class="col-md-8">
<div class="card shadow-sm">
<div class="card-header bg-primary text-white">
<h4 class="mb-0">Update {{ object.name|default:"Item" }}</h4>
</div>
<div class="card-body">
<form method="POST">
{% csrf_token %}
{{ form.as_p }}

<div class="text-end">
<button type="submit" class="btn btn-success">Update</button>
<a href="{% url 'main:Description2_list' %}" class="btn btn-secondary">Cancel</a>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
{% endblock content %}
