{% include 'main/navbar_templates/home_navbar.html' %}
{% block content %}
<style>
  .form-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f8fbff, #ffffff);
    padding: 60px 20px;
  }

  .form-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    padding: 40px 50px;
    max-width: 650px;
    width: 100%;
  }

  .form-card h3 {
    font-weight: 700;
    color: #0d6efd;
    margin-bottom: 25px;
  }

  form label {
    font-weight: 600;
    color: #333;
  }

  .form-control,
  textarea {
    border-radius: 10px !important;
    border: 1px solid #ced4da;
    padding: 10px 12px;
    font-size: 1rem;
  }

  .form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 5px rgba(13, 110, 253, 0.25);
  }

  .btn {
    border-radius: 30px;
    padding: 10px 25px;
    font-weight: 600;
    transition: all 0.3s ease-in-out;
  }

  .btn-primary {
    background-color: #0d6efd;
    border: none;
  }

  .btn-primary:hover {
    background-color: #0b5ed7;
    transform: scale(1.05);
  }

  .btn-secondary {
    background-color: #6c757d;
    border: none;
  }

  .btn-secondary:hover {
    background-color: #5c636a;
    transform: scale(1.05);
  }
</style>

<div class="form-section">
  <div class="form-card">
    <h3 class="text-center">{{ title }}</h3>

    <form method="POST" novalidate>
      {% csrf_token %}
      {{ form.as_p }}

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary me-2">💾 Save</button>
        <a href="{% url 'main:testimonials_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
