{% extends "main/base_templates/base.html" %}

{% block content %}
<div class="container">
    <h2>Edit Donation</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">Update Donation</button>
        <a href="{% url 'main:donation_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
