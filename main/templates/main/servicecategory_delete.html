{% extends "main/base_templates/base.html" %}

{% block title %}All Service Categories{% endblock %}

{% block content %}
<div class="card card-soft p-4" style="max-width:820px;">
  <h4 class="mb-2 text-danger">Delete Preference</h4>
  <p class="text-muted">Are you sure you want to delete <strong>{{ pref.title }}</strong>?</p>

  <form method="POST">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, Delete</button>
    <a class="btn btn-light" href="#">Cancel</a>
  </form>
</div>
{% endblock %}
