{% extends "main/base_templates/base.html"%}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisis Management | Diaspora County 48</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
        }
        .text-brand-blue { color: #1e40af; } 
        .bg-brand-blue { background-color: #1e40af; } 
        .text-brand-green { color: #0a926d; } 
        .bg-brand-green { background-color: #0a926d; }
        .text-brand-red { color: #cc0000; }
        .bg-brand-red { background-color: #cc0000; } 
        .main-heading { font-weight: 900; } 
         
        .service-block {
            margin-bottom: 4rem;
            padding-top: 2rem;
            padding-bottom: 2rem;
        } 
        .service-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .service-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.5rem;
            width: 0.5rem;
            height: 0.5rem;
            background-color: #cc0000;  
            border-radius: 50%;
        }
 
        .loading-placeholder {
            min-height: 280px; 
            background-color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-weight: 600;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-custom {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
 
        .hero-image-container {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
     <!-- HERO SECTION - Background updated to Teal -->
        <header class="bg-brand-green text-white shadow-xl overflow-hidden mb-12">
            <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 items-center">
                <!-- Text Content Column -->
                <div class="p-8 md:p-12 lg:p-16">
                    <h1 class="text-5xl main-heading mb-4">CRISIS MANAGEMENT</h1>
                    <h2 class="text-xl font-medium text-gray-200 mb-8">
                        Immediate, reliable support and rapid response during personal or civil emergencies abroad.
                    </h2>
                    <a href="#" class="inline-block bg-brand-red text-white font-bold py-3 px-6 rounded-lg uppercase text-sm tracking-wider hover:bg-red-700 transition duration-300 shadow-lg text-lg">
                        ACTIVATE EMERGENCY HELP LINE (24/7)
                    </a>
                </div>
                <!-- Image Column -->
                <div class="w-full h-full hero-image-container">
                    <img id="image-hero"  
                         src="{% static 'main/img/lady.png' %}" 
                         class="w-full h-full object-cover loading-placeholder"
                         style="max-height: 400px; min-height: 400px;">
                </div>
            </div>
        </header>
</body>
</html>
{% endblock %}
