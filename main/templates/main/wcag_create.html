<!DOCTYPE html>
<html>
<head>
    <title>Add WCAG Website</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #273c75;
            color: white;
            border: none;
            border-radius: 5px;
        }

        a {
            display: block;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Add WCAG Website</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Company</label>
        {{ form.company }}

        <label>App Name</label>
        {{ form.app_name }}

        <label>Page Name</label>
        {{ form.page_name }}

        <label>Upload File</label>
        {{ form.website_url }}

        <button type="submit">Save</button>
    </form>

    <a href="{% url 'main:wcag_list' %}">⬅ Back to Dashboard</a>
</div>

</body>
</html>
