{% extends "main/base_templates/base.html" %} {% block content %}

<div class="container mt-4">
  <h2>Delete Legal Service</h2>

  <p>Are you sure you want to delete this legal service?</p>

  <h5>{{ legal_service }}</h5>

  <form method="POST">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">Yes, Delete</button>

    <a href="{% url 'main:legal_service_list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
</div>

{% endblock %}
