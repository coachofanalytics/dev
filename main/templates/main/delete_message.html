{% extends "main/base_templates/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm p-4 border-danger">
        <h2 class="mb-4 text-danger">Delete Message</h2>

        <p>
            Are you sure you want to permanently delete the following message?
        </p>

        <ul class="list-group mb-3">
            <li class="list-group-item"><strong>Name:</strong> {{ message.name }}</li>
            <li class="list-group-item"><strong>Email:</strong> {{ message.email }}</li>
            <li class="list-group-item"><strong>Message:</strong> {{ message.message }}</li>
        </ul>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">🗑️ Yes, Delete Message</button>
            <a href="{% url 'main:message_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
