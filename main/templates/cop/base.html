<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}COP Contract Center{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1f1c1a;
        --muted: #6a625c;
        --paper: #f7f2ea;
        --card: #ffffff;
        --accent: #e36d5a;
        --accent-2: #177e7a;
        --accent-3: #f1b24a;
        --border: #e4dbd0;
        --shadow: 0 18px 40px rgba(31, 28, 26, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, rgba(227, 109, 90, 0.18), transparent 55%),
          radial-gradient(circle at 90% 20%, rgba(23, 126, 122, 0.18), transparent 50%),
          linear-gradient(135deg, #fbf6ef, #f3ece3);
        min-height: 100vh;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(10px);
        background: rgba(247, 242, 234, 0.92);
        border-bottom: 1px solid var(--border);
      }

      .nav {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand span {
        font-family: "Fraunces", serif;
        font-size: 20px;
        letter-spacing: 0.5px;
      }

      .brand small {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 11px;
      }

      .nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .nav-links a {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid transparent;
        transition: 0.2s ease;
      }

      .nav-links a:hover,
      .nav-links a.active {
        border-color: var(--accent-2);
        color: var(--accent-2);
        background: rgba(23, 126, 122, 0.08);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 24px 56px;
      }

      .hero {
        display: grid;
        gap: 10px;
        margin-bottom: 24px;
      }

      .hero h1 {
        font-family: "Fraunces", serif;
        font-size: 36px;
        margin: 0;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 20px;
      }

      .grid.cols-2 {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .grid.cols-3 {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        box-shadow: var(--shadow);
        animation: rise 0.4s ease both;
      }

      .card h2,
      .card h3 {
        margin-top: 0;
        font-family: "Fraunces", serif;
      }

      .muted {
        color: var(--muted);
      }

      .input,
      textarea,
      select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fffdf9;
        font-family: inherit;
      }

      textarea {
        resize: vertical;
      }

      label {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        margin-bottom: 6px;
        display: block;
      }

      .button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .button.secondary {
        background: transparent;
        color: var(--accent-2);
        border-color: var(--accent-2);
      }

      .button.ghost {
        background: transparent;
        border-color: var(--border);
        color: var(--ink);
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(227, 109, 90, 0.12);
        color: var(--accent);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: #f7efe4;
        color: var(--muted);
      }

      .badge[data-state="GENERATED"] {
        background: rgba(23, 126, 122, 0.15);
        color: var(--accent-2);
      }

      .badge[data-state="SENT"] {
        background: rgba(241, 178, 74, 0.2);
        color: #b67519;
      }

      .badge[data-state="SIGNED"],
      .badge[data-state="EXECUTED"] {
        background: rgba(35, 138, 84, 0.15);
        color: #238a54;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .item {
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: #fff;
      }

      .split {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .form-grid {
        display: grid;
        gap: 12px;
      }

      .helper {
        font-size: 12px;
        color: var(--muted);
      }

      .banner {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        padding: 16px;
        border-radius: 18px;
        background: rgba(23, 126, 122, 0.1);
        border: 1px solid rgba(23, 126, 122, 0.2);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
      }

      @media (max-width: 720px) {
        .nav {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <header>
      <nav class="nav">
        <div class="brand">
          <span>COP Contract Center</span>
          <small>Placements and signatures</small>
        </div>
        <div class="nav-links">
          <a href="{% url 'main:cop_dashboard' %}">Dashboard</a>
          <a href="{% url 'main:cop_placements' %}">Create Placement</a>
          <a href="{% url 'main:cop_templates' %}">Templates</a>
          <a href="{% url 'main:cop_contracts' %}">Contracts</a>
        </div>
      </nav>
    </header>
    <main class="container">
      {% if messages %}
        <div class="list" style="margin-bottom: 18px;">
          {% for message in messages %}
            <div class="item">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
