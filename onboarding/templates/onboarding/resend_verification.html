{% extends 'base.html' %}

{% block title %}Resend Verification Email - Biashara Bridges{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h3><i class="bi bi-envelope-arrow-up"></i> Resend Verification Email</h3>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted">
                        Click the button below to receive a new verification email.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-send"></i> Send Verification Email
                        </button>
                    </form>

                    <hr class="my-4">

                    <p class="text-muted small text-center">
                        <a href="{% url 'login' %}">Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
