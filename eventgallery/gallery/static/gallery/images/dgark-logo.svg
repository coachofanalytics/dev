<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#2ecc71;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
        </linearGradient>
        
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="2" dy="2" result="offsetblur"/>
            <feFlood flood-color="rgba(0,0,0,0.3)"/>
            <feComposite in2="offsetblur" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <g filter="url(#shadow)">
        <!-- D Letter -->
        <path d="M20,20 L20,80 Q50,65 50,50 Q50,35 20,20 Z" 
              fill="url(#logoGradient)" />
        
        <!-- G Letter -->
        <path d="M70,30 Q100,20 100,50 Q100,80 70,70 L70,50 L90,50" 
              fill="url(#logoGradient)" stroke="url(#logoGradient)" stroke-width="5" />
        
        <!-- A Letter -->
        <polygon points="120,20 150,80 180,20 160,50" 
                 fill="url(#logoGradient)" />
        
        <!-- R Letter -->
        <path d="M200,20 L200,80 L230,50 L220,40" 
              fill="url(#logoGradient)" />
        
        <!-- K Letter -->
        <path d="M250,20 L250,80 M250,50 L280,80 M250,50 L280,20" 
              stroke="url(#logoGradient)" stroke-width="8" fill="none" />
    </g>
    
    <text x="20" y="95" font-family="Arial, sans-serif" font-size="16" fill="url(#logoGradient)">
        DGARK
    </text>
</svg>