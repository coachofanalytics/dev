<div class="flex rounded-[14px] border border-slate-200 p-5 w-full justify-between items-center bg-white shadow-sm">
    <div class="flex flex-col">
        <p class="text-sm font-medium text-slate-500">{{ label }}</p>
        <p class="text-3xl font-bold text-slate-900 mt-1">{{ value }}</p>
    </div>
    <div class="w-12 h-12 rounded-2xl flex items-center justify-center"
         style="background-color: color-mix(in srgb, {{ color }} 16%, transparent);">
        <div class="w-4 h-4 rounded-md" style="background-color: {{ color }};"></div>
    </div>
</div>
