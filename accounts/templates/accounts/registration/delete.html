{% extends "main/base_templates/accounts_base.html" %}

{% block content %}
<div class="container mt-5">
  <h2>Delete Credential category</h2>
  <p>Are you sure you want to delete the credential category: <strong>{{ credential.name }}</strong>?</p>
  
  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'accounts:credentialcategory_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
