{% extends "main/base_templates/accounts_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Update Credential Categories{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Update Credential Categories</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="form-group mt-3">
            <button type="submit" class="btn btn-primary">Update</button>
             <a href="{% url 'accounts:credentialcategory_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
