{% extends "main/base_templates/accounts_base.html" %}
{% block content %}
<div class="container mt-5">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
    <h2 class="fw-bold text-danger">
      <i class="bi bi-trash"></i> Confirm Delete
    </h2>
    <a href="{% url 'accounts:tracker_list' %}" class="btn btn-outline-secondary rounded-pill">
      <i class="bi bi-arrow-left-circle"></i> Back to List
    </a>
  </div>

  <!-- Delete Confirmation Card -->
  <div class="card shadow-sm border-0 text-center">
    <div class="card-body py-5">
      <h5 class="mb-3 text-muted">
        Are you sure you want to delete this tracker record?
      </h5>

      <div class="mb-3">
        <p class="fw-bold mb-1 text-dark">{{ tracker.task }}</p>
        <p class="text-muted mb-0">
          {{ tracker.category }} — {{ tracker.employee }}
        </p>
      </div>

      <form method="POST" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4 rounded-pill shadow-sm me-2">
          <i class="bi bi-check-circle"></i> Yes, Delete
        </button>
        <a href="{% url 'accounts:tracker_list' %}" class="btn btn-outline-secondary px-4 rounded-pill shadow-sm">
          <i class="bi bi-x-circle"></i> Cancel
        </a>
      </form>
    </div>
  </div>

</div>
{% endblock %}
