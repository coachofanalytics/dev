{% extends "main/base_templates/accounts_base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container">
    <h2>Add a CredentialCategory</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">Save Credential</button>
        <a href="{% url 'accounts:credentialcategory_list' %}" class="btn btn-secondary">Cancel</a>

    </form>
</div>
{% endblock %}
