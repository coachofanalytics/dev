{% extends "main/base_templates/accounts_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Update Trackers{% endblock %}

{% block content %}
<div class="container mt-5">

    <!-- Header Section -->
    <div class="card shadow-lg border-0 mb-4">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top">
            <h3 class="mb-0"><i class="fas fa-edit me-2"></i>Update Trackers</h3>
            <a href="{% url 'accounts:tracker_list' %}" class="btn btn-light btn-sm">
                <i class="fas fa-arrow-left"></i> Back to List
            </a>
        </div>

        <!-- Form Body -->
        <div class="card-body bg-light">
            <form method="POST" class="p-3">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-success me-2">
                        <i class="fas fa-save"></i> Update
                    </button>
                    <a href="{% url 'accounts:tracker_list' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
