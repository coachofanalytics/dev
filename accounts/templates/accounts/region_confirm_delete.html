{%extends "main/base_templates/base.html"%} 
{% load static %}
{% block content %} 
<section id="career">       
        
    <h1>Are you sure you want to delete this region?</h1>

    <p>Region: {{ region.name }}</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>
    <br>
    <a href="{% url 'accounts:list_regions' %}">Cancel</a>
</section>
{% endblock %}
