{% extends "main/base_templates/accounts_base.html" %}
{% block content %}

<div class="container mt-5">
    <h2 class="text-center mb-4">✏️ Update Transaction</h2>

    <div class="card shadow-sm p-4">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mt-3 text-end">
                <button type="submit" class="btn btn-primary">Update</button>
                <a href="{% url 'accounts:accounts-all_transaction_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
