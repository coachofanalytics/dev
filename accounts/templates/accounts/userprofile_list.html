<h1>User Profiles</h1>

<ul>
{% for profile in profiles %}
    <li>
        <strong>{{ profile.user.username }}</strong>

        {% if profile.city or profile.country %}
            <br>
            {{ profile.city }}{% if profile.city and profile.country %}, {% endif %}{{ profile.country }}
        {% endif %}
    </li>
{% empty %}
    <li>No profiles found.</li>
{% endfor %}
</ul>
