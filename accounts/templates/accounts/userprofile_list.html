<h1>Applicant Profiles Directory</h1>

<hr>

{% for profile in profiles %}
    <div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 10px;">
        <h3>Applicant ID: {{ profile.id }}</h3>
        <p><strong>Position:</strong> {{ profile.position|default:"Not provided" }}</p>
        <p><strong>Company:</strong> {{ profile.company|default:"Not provided" }}</p>
        
        <!-- Link to the actual Detail View -->
        <a href="{% url 'accounts:profile_detail' profile.pk %}">View Full Profile &rarr;</a>
    </div>
{% empty %}
    <p>No applicant profiles have been created yet.</p>
{% endfor %}
