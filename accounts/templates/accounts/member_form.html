{% extends 'main/base_templates/base.html' %}
{% block content %}
<h2>{% if form.instance.pk %}Edit Member{% else %}Add Member{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'accounts:member-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock content %}
