{% extends "main/base_templates/accounts_base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Delete Task Group</h2>
        <p class="text-center text-danger">
            Are you sure you want to delete <strong>{{ taskgroup.name }}</strong>?
        </p>

        <form method="post" class="text-center">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>
            <a href="{% url 'accounts:account-Task_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
