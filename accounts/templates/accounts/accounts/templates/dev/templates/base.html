<!DOCTYPE html>
<html>
<head>
    <title>CODA System</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin:40px;
            background:#f5f5f5;
        }

        .container{
            background:white;
            padding:25px;
            border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            padding:10px;
            border:1px solid #ddd;
            text-align:left;
        }

        th{
            background:#2c3e50;
            color:white;
        }

        h2{
            margin-bottom:20px;
        }
    </style>
</head>

<body>

<div class="container">

{% block content %}
{% endblock %}

</div>

</body>
</html>
