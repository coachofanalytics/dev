{% extends "main/base_templates/accounts_base.html" %}

{% block title %}Update Tracker{% endblock %}

{% block content %}
<div class="container mt-4">
    <h4 class="fw-bold mb-3">Update Tracker</h4>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'accounts:tracker_detail' tracker.id %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
