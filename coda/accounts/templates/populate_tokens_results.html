<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Population Results</title>
</head>
<body>
    <h1>Verification Token Population Results</h1>
    
    <table border="1">
        <thead>
            <tr>
                <th>User ID</th>
                <th>Old Token</th>
                <th>New Token</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for result in results %}
            <tr>
                <td>{{ result.user_id }}</td>
                <td>{{ result.old_token }}</td>
                <td>{{ result.new_token }}</td>
                <td>{{ result.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
