{%extends "main/base_templates/application_base.html"%} {% block content %}
<section id="career">
    <div class="career text-center">
        <br><br>
        <h2>Email Verification</h2>

        <!-- <p> Check your Email and Otp here in order to view passwords.</p> -->
        <h1>{{ subject }}</h1>
        <p>Enter Your Email to receive a one time authorization code.</strong></p>
        <!-- <p>Please use this code to complete your verification.</p> -->
        
        <p style="color:red">
            {% if message != "" %}
                {{message}}
            {% endif %}
        </p>
        <form action="{% url 'accounts:register_and_login_user' %}" method="POST">
            {% csrf_token %}
            <!-- <input type="text" name="otp" class="otp" placeholder="Enter otp here" style="margin:20px 0" /> -->
            <input type="email" name="email" class="email" placeholder="Enter Email here" style="margin:20px 0" />

            <input type="submit" id="submit_email" value="Submit" >
        </form>

    </div>

</section>
{% endblock content %}
