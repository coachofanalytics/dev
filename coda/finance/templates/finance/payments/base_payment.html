{% extends "main/base_templates/new_base.html" %}
{% load static %}

{% block extra_css %}
<style>
    /* Common Payment Styles */
    .payment-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        color: white;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    .payment-form {
        background: white;
        border-radius: 10px;
        padding: 30px;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .payment-history-card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        border-left: 4px solid #667eea;
    }
    
    .status-badge {
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        text-align: center;
        display: inline-block;
    }
    
    .status-complete { background-color: #d4edda; color: #155724; }
    .status-pending { background-color: #fff3cd; color: #856404; }
    .status-failed { background-color: #f8d7da; color: #721c24; }
    .status-in-progress { background-color: #d1ecf1; color: #0c5460; }
    .status-collection { background-color: #f8d7da; color: #721c24; }
    .status-bad { background-color: #f5c6cb; color: #721c24; }
    
    .amount-positive { color: #27ae60; font-weight: bold; }
    .amount-negative { color: #e74c3c; font-weight: bold; }
    .amount-neutral { color: #95a5a6; font-weight: bold; }
    
    .payment-method {
        padding: 4px 12px;
        border-radius: 15px;
        font-size: 0.8rem;
        font-weight: bold;
        background-color: #e9ecef;
        color: #495057;
    }
    
    .payment-method-mpesa { background-color: #d4edda; color: #155724; }
    .payment-method-bank { background-color: #d1ecf1; color: #0c5460; }
    .payment-method-cash { background-color: #fff3cd; color: #856404; }
    
    .filter-buttons {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .filter-btn {
        background: transparent;
        border: 2px solid #667eea;
        color: #667eea;
        padding: 8px 16px;
        border-radius: 20px;
        text-decoration: none;
        display: inline-block;
        margin: 5px;
        transition: all 0.3s;
    }
    
    .filter-btn:hover {
        background: #667eea;
        color: white;
        text-decoration: none;
    }
    
    .filter-btn.active {
        background: #667eea;
        color: white;
    }
    
    .action-buttons {
        text-align: center;
        margin-top: 2rem;
    }
    
    .action-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        padding: 12px 24px;
        border-radius: 25px;
        text-decoration: none;
        display: inline-block;
        margin: 5px;
        transition: transform 0.2s;
        font-weight: 500;
    }
    
    .action-btn:hover {
        color: white;
        text-decoration: none;
        transform: translateY(-2px);
    }
    
    .action-btn-secondary {
        background: transparent;
        border: 2px solid #667eea;
        color: #667eea;
    }
    
    .action-btn-secondary:hover {
        background: #667eea;
        color: white;
    }
    
    .table-responsive {
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .table th {
        background-color: #f8f9fa;
        border: none;
        font-weight: 600;
        color: #495057;
    }
    
    .table td {
        border: none;
        border-bottom: 1px solid #e9ecef;
        vertical-align: middle;
    }
    
    .table tbody tr:hover {
        background-color: #f8f9fa;
    }
    
    .form-group label {
        font-weight: 600;
        color: #495057;
        margin-bottom: 8px;
    }
    
    .form-control {
        border-radius: 8px;
        border: 2px solid #e9ecef;
        padding: 12px 16px;
        transition: border-color 0.3s;
    }
    
    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    console.log('Payment dashboard loaded');
    
    // Filter button functionality
    $('.filter-btn').click(function() {
        $('.filter-btn').removeClass('active');
        $(this).addClass('active');
        
        // You can add filter logic here
        var status = $(this).data('status');
        console.log('Filtering by status:', status);
    });
    
    // Initialize tooltips
    $('[data-toggle="tooltip"]').tooltip();
    
    // Initialize popovers
    $('[data-toggle="popover"]').popover();
    
    // Auto-refresh data every 5 minutes
    setInterval(function() {
        console.log('Refreshing payment data...');
        // You can add AJAX calls here to refresh specific data
    }, 300000);
});
</script>
{% endblock %}
