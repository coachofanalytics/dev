{% extends "main/base_templates/base.html" %}
{% load static %}

{% block title %}Risk Assessment{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4"><i class="fas fa-clipboard-check text-primary"></i> Risk Assessment</h2>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Submit Assessment</button>
                    <a href="{% url 'investing_risk:risk-dashboard' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
