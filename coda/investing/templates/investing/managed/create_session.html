{% extends "main/base_templates/new_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container py-4">
    <h2>Record Session - {{ account.account_number }}</h2>
    <p>Sessions this month: {{ sessions_this_month }} / {{ account.sessions_per_month }}</p>
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Record Session</button>
                <a href="{% url 'investing:managed_account_detail' account.id %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
