<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ plan.name }} - Details</title>
</head>
<body>
    <div class="container">
        <h2>{{ plan.name }}</h2>
        <p>{{ plan.description }}</p>
        <p><strong>Advantages:</strong> {{ plan.advantages }}</p>
        <p><strong>Equity Ownership:</strong> {{ plan.equity_ownership }}%</p>
        <p><strong>Price:</strong> ${{ plan.share_per_price }}</p>
        <p><strong>Duration:</strong> {{ plan.duration }} months</p>
        <a href="{% url 'investing:newinvestment' %}?plan={{ plan.id }}" class="btn btn-primary">Proceed with Investment</a>
    </div>
</body>
</html>
