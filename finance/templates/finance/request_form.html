{% extends "main/base_templates/base.html" %}

{% block content %}
<main class="mx-auto pb-16 pt-8">
    <div class="max-w-xl mx-auto px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">{{ title }}</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Service Type</label>
                    {{ form.service_type }}
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-bold mb-2">Details</label>
                    {{ form.details }}
                </div>
                <div class="flex justify-between items-center">
                    <a href="{% url 'finance:planning_list' %}" class="text-gray-500 hover:text-gray-700">Cancel</a>
                    <button type="submit"
                        class="bg-brand-blue text-white font-bold py-2 px-6 rounded-lg hover:bg-[#16317b] transition duration-300 shadow-md">
                        Update Request
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock content %}
