<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Faq</title>
</head>
<body>
    <h1>Are you sure you want to delete this FAQ?</h1>

    <p>Question: {{ faq.question }}</p>
    <p>Answer: {{ faq.answer }}</p>

    <form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    </form>

    <br>
    <a href="{% url 'finance:faqs' %}">Cancel</a>
</body>
</html>
