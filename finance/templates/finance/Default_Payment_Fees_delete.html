{% extends "finance/finance_base.html" %}
{% block content %}
<div class="container mt-4">
  <h3>Delete Default Payment Fees</h3>
  <p>Are you sure you want to delete <strong>{{ object.id }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'Default_Payment_Fees_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

{% endblock %}
