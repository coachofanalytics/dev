<!DOCTYPE html>
<html>
<head>
    <title>Email Validation</title>
</head>
<body>
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <h1>Email Validation Process</h1>
    <p>The email validation process is complete. Check the success message above for details.</p>
</body>
</html>
