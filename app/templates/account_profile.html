<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f8fb;
            font-family: Arial, sans-serif;
            color: #172554;
        }

        .page-container {
            max-width: 1020px;
            margin: 0 auto;
            padding: 30px;
        }

        .page-title {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            color: #1e3a6d;
        }

        .page-subtitle {
            margin-top: 8px;
            margin-bottom: 35px;
            font-size: 17px;
            color: #334155;
        }

        .profile-card {
            background: white;
            border: 1px solid #d8dee9;
            border-radius: 8px;
            padding: 30px 32px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        }

        .section {
            margin-bottom: 34px;
        }

        .section-title {
            margin: 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #d9dee8;
            font-size: 18px;
            font-weight: 700;
            color: #1e3a6d;
        }

        .location-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 18px;
        }

        .field-group label {
            display: block;
            margin-bottom: 7px;
            color: #172554;
            font-size: 15px;
        }

        .field-group input[type="text"] {
            width: 100%;
            height: 44px;
            padding: 10px 12px;
            border: 1px solid #d6dce6;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        .field-group input[type="text"]:focus {
            border-color: #1e3a6d;
            box-shadow: 0 0 0 3px rgba(30, 58, 109, 0.1);
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .role-option {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 16px;
            color: #172554;
        }

        .role-option input {
            width: 15px;
            height: 15px;
        }

        .upload-box {
            margin-top: 17px;
            border: 2px dashed #cbd3df;
            border-radius: 8px;
            padding: 28px 24px;
            text-align: center;
        }

        .upload-help {
            margin: 0 0 12px;
            color: #64748b;
            font-size: 15px;
        }

        .file-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .file-input {
            display: none;
        }

        .choose-file-button {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            background: #1e3a6d;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .file-name {
            color: #64748b;
            font-size: 14px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 18px;
        }

        .save-button {
            border: none;
            border-radius: 6px;
            background: #f0ad3d;
            color: white;
            padding: 13px 32px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-button:hover {
            background: #dd971f;
        }

        .message {
            padding: 12px 14px;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 800px) {
            .location-grid {
                grid-template-columns: 1fr;
            }

            .role-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .page-container {
                padding: 20px 14px;
            }

            .profile-card {
                padding: 22px 18px;
            }

            .role-grid {
                grid-template-columns: 1fr;
            }

            .save-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="page-container">
        <h1 class="page-title">Account Profile</h1>

        <p class="page-subtitle">
            Manage your professional information and credentials.
        </p>

        {% if success %}
            <div class="message success-message">
                {{ success }}
            </div>
        {% endif %}

        {% if error %}
            <div class="message error-message">
                {{ error }}
            </div>
        {% endif %}

        <form
            class="profile-card"
            method="post"
            action="/accounts/profile"
            enctype="multipart/form-data"
        >
            <section class="section">
                <h2 class="section-title">Location Details</h2>

                <div class="location-grid">
                    <div class="field-group">
                        <label for="city">City</label>
                        <input
                            type="text"
                            id="city"
                            name="city"
                            value="{{ profile.city if profile else '' }}"
                        >
                    </div>

                    <div class="field-group">
                        <label for="state">State</label>
                        <input
                            type="text"
                            id="state"
                            name="state"
                            value="{{ profile.state if profile else '' }}"
                        >
                    </div>

                    <div class="field-group">
                        <label for="country">Country</label>
                        <input
                            type="text"
                            id="country"
                            name="country"
                            value="{{ profile.country if profile else '' }}"
                        >
                    </div>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">Role Management</h2>

                <div class="role-grid">
                    <label class="role-option">
                        <input
                            type="checkbox"
                            name="is_admin"
                            {% if profile and profile.is_admin %}checked{% endif %}
                        >
                        Admin
                    </label>

                    <label class="role-option">
                        <input
                            type="checkbox"
                            name="is_employee"
                            {% if profile and profile.is_employee %}checked{% endif %}
                        >
                        Employee
                    </label>

                    <label class="role-option">
                        <input
                            type="checkbox"
                            name="is_client"
                            {% if profile and profile.is_client %}checked{% endif %}
                        >
                        Client
                    </label>

                    <label class="role-option">
                        <input
                            type="checkbox"
                            name="is_applicant"
                            {% if profile and profile.is_applicant %}checked{% endif %}
                        >
                        Applicant
                    </label>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">Professional Resume</h2>

                <div class="upload-box">
                    <p class="upload-help">
                        Upload your resume (PDF or DOCX, Max 5MB)
                    </p>

                    <div class="file-row">
                        <label
                            for="resume"
                            class="choose-file-button"
                        >
                            Choose File
                        </label>

                        <input
                            class="file-input"
                            type="file"
                            id="resume"
                            name="resume"
                            accept=".pdf,.doc,.docx"
                        >

                        <span
                            id="file-name"
                            class="file-name"
                        >
                            No file chosen
                        </span>
                    </div>
                </div>
            </section>

            <div class="actions">
                <button
                    type="submit"
                    class="save-button"
                >
                    Save Changes
                </button>
            </div>
        </form>
    </main>

    <script>
        const resumeInput = document.getElementById("resume");
        const fileName = document.getElementById("file-name");

        resumeInput.addEventListener("change", function () {
            if (this.files.length > 0) {
                fileName.textContent = this.files[0].name;
            } else {
                fileName.textContent = "No file chosen";
            }
        });
    </script>
</body>
</html>
