<!DOCTYPE html>
<html>
<head>
    <title>Edit Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1>Edit Search Record</h1>

    <form method="post" action="/search-dashboard/update/{{ record.id }}">

        <div class="mb-3">
            <label class="form-label">Topic</label>
            <input type="text" name="topic" class="form-control" value="{{ record.topic }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Question</label>
            <textarea name="question" class="form-control" rows="5" required>{{ record.question }}</textarea>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="uploaded" value="true" {% if record.uploaded %}checked{% endif %}>
            <label class="form-check-label">Uploaded</label>
        </div>

        <button type="submit" class="btn btn-success">Update Record</button>
        <a href="/search-dashboard" class="btn btn-secondary">Cancel</a>

    </form>

</div>

</body>
</html>
