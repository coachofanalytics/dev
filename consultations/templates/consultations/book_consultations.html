{% extends "base.html" %}
{% load static %}

{% block title %}Book a Consultation{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Book a Legal Consultation</h2>
    <form method="post">
        {% csrf_token %}
        <!-- Your form fields go here -->
        <div class="mb-2">
            <label for="id_name" class="form-label">Name</label>
            <input type="text" name="name" class="form-control" id="id_name" required>
        </div>
        <div class="mb-2">
            <label for="id_email" class="form-label">Email</label>
            <input type="email" name="email" class="form-control" id="id_email" required>
        </div>
        <div class="mb-3">
            <label for="id_phone" class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" id="id_phone" required>
        </div>
        <div class="mb-3">
            <label for="id_description" class="form-label">Description</label>
            <textarea name="description" class="form-control" id="id_description" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}
