<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Community</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #10b981;
            --light-green: #d1fae5;
            --dark-green: #059669;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-700: #374151;
            --gray-900: #111827;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #ecfdf5 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .join-card {
            background: var(--white);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 3rem 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--gray-200);
        }
        
        .join-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .join-title {
            color: var(--dark-green);
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }
        
        .join-subtitle {
            color: var(--gray-700);
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .form-group {
            margin-bottom: 1.75rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--gray-900);
            font-size: 0.95rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            transition: all 0.3s ease;
            background: var(--white);
        }
        
        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
            outline: none;
        }
        
        .checkbox-group {
            margin: 2rem 0;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            border: 2px solid var(--gray-300);
            border-radius: 4px;
            cursor: pointer;
            margin-top: 0.2rem;
            accent-color: var(--primary-green);
        }
        
        .checkbox-label {
            font-size: 0.9rem;
            color: var(--gray-700);
            line-height: 1.5;
        }
        
        .checkbox-label a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 500;
        }
        
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }
        
        .message-container {
            margin-bottom: 1.5rem;
        }
        
        .alert-success {
            background: linear-gradient(135deg, var(--light-green) 0%, #a7f3d0 100%);
            border: 1px solid var(--primary-green);
            color: var(--dark-green);
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
        }
        
        .back-link {
            text-align: center;
            margin-top: 2rem;
        }
        
        .back-link a {
            color: var(--gray-600);
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .back-link a:hover {
            color: var(--primary-green);
        }
        
        .community-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: white;
            font-size: 2.5rem;
        }
        
        @media (max-width: 576px) {
            .join-card {
                padding: 2rem 1.5rem;
            }
            
            .join-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="join-card">
        <!-- Header -->
        <div class="join-header">
            <div class="community-icon">
                <i class="fas fa-users"></i>
            </div>
            <h1 class="join-title">Join Community</h1>
            <p class="join-subtitle">Enter your details to become a verified member</p>
        </div>
        
        <!-- Messages -->
        <div class="message-container">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert-success">
                        <i class="fas fa-check-circle"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>
        
        <!-- Form - ONLY 2 FIELDS -->
        <form method="POST" action="{% url 'join' %}">
            {% csrf_token %}
            
            <!-- Field 1: Name -->
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" 
                       id="name" 
                       name="name" 
                       class="form-control" 
                       placeholder="Enter your full name"
                       value="{{ form.name.value|default:'' }}"
                       required>
            </div>
            
            <!-- Field 2: Email -->
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       class="form-control" 
                       placeholder="Enter your email address"
                       value="{{ form.email.value|default:'' }}"
                       required>
            </div>
            
            <!-- Directory Agreement Checkbox -->
            <div class="checkbox-group">
                <div class="checkbox-wrapper">
                    <input type="checkbox" 
                           id="agree_to_directory" 
                           name="agree_to_directory" 
                           value="true"
                           {% if form.agree_to_directory.value %}checked{% endif %}
                           required>
                    <label for="agree_to_directory" class="checkbox-label">
                        I agree to be listed in the public member directory
                    </label>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="submit-btn">
                <i class="fas fa-user-plus"></i> Join Now
            </button>
        </form>
        
        <!-- Back Link -->
        <div class="back-link">
            <a href="{% url 'home' %}">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Simple form validation
            const form = document.querySelector('form');
            const submitBtn = form.querySelector('.submit-btn');
            
            form.addEventListener('submit', function(e) {
                // Show loading state
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Joining...';
                submitBtn.disabled = true;
                
                // If form is invalid, re-enable button after 2 seconds
                setTimeout(() => {
                    if (!form.checkValidity()) {
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                }, 2000);
            });
        });
    </script>
</body>
</html>
