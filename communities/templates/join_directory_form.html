<!DOCTYPE html>
<html>
<head>
    <title>Join Professional Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f6f7fb; padding: 20px; }
        .form-card { 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .btn-success { background: #0d9f6e; border: none; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2 class="mb-4 text-success">Join Professional Directory</h2>
        <p class="text-muted mb-4">Complete your profile to appear in the directory</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ name }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Profession / Job Title</label>
                <input type="text" name="profession" class="form-control" placeholder="e.g., Software Engineer" value="{{ profession }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Region / City</label>
                <input type="text" name="region" class="form-control" placeholder="e.g., New York, NY" value="{{ region }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Professional Category</label>
                <select name="category" class="form-select">
                    {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-4">
                <label class="form-label">Expertise Summary</label>
                <textarea name="expertise" class="form-control" rows="4" placeholder="Describe your skills, experience, and what you offer to the community..."></textarea>
            </div>
            
            <div class="d-flex gap-3">
                <a href="{% url 'member_directory' %}" class="btn btn-secondary flex-grow-1">Cancel</a>
                <button type="submit" class="btn btn-success flex-grow-1">Save Profile</button>
            </div>
        </form>
    </div>
</body>
</html>
