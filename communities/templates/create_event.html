{% extends "main/base_templates/base.html" %}
{% load static %}

{% block content %}

<main class="max-w-7xl mx-auto py-16 px-6">

    <!-- Hero Section -->
    <header class="bg-brand-blue text-white shadow-xl mb-12 py-12">
        <div class="text-center">
            <h1 class="text-5xl font-extrabold mb-4">Create a New Event</h1>
            <p class="text-xl font-medium text-gray-200">Fill in the details below to create a new event.</p>
        </div>
    </header>

    <!-- Event Creation Form -->
    <section class="bg-white shadow-lg rounded-lg p-8 mb-16">
        {{ form.errors }}
        <form method="POST" action="{% url 'communities:create_event' %}">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Event Name -->
                <div>
                    <input type="text" name="name" class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-brand-green focus:outline-none focus:ring-2 focus:ring-brand-green" placeholder="Event Name" value="{{ form.name.value|default:'' }}">
                </div>

                <!-- Start Date -->
                <div>
                    <input type="datetime-local" name="start_date" class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-brand-green focus:outline-none focus:ring-2 focus:ring-brand-green" placeholder="Start Date" value="{{ form.start_date.value|default:'' }}">
                </div>

                <!-- End Date -->
                <div>
                    <input type="datetime-local" name="end_date" class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-brand-green focus:outline-none focus:ring-2 focus:ring-brand-green" placeholder="End Date" value="{{ form.end_date.value|default:'' }}">
                </div>

                <!-- Location -->
                <div>
                    <input type="text" name="location" class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-brand-green focus:outline-none focus:ring-2 focus:ring-brand-green" placeholder="Location" value="{{ form.location.value|default:'' }}">
                </div>

                <!-- Description -->
                <div class="col-span-2">
                    <textarea name="description" rows="4" class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-brand-green focus:outline-none focus:ring-2 focus:ring-brand-green" placeholder="Description">{{ form.description.value|default:'' }}</textarea>
                </div>
                
                <!-- Submit Button -->
                <div class="col-span-2 text-center">
                    
                    <button type="submit" class="bg-brand-green text-white py-3 px-6 rounded-lg hover:bg-[#086a4f] transition duration-300 focus:outline-none focus:ring-2 focus:ring-brand-green focus:ring-opacity-50">
                        Create Event
                    </button>
                    <a href="{% url 'communities:event_calendar' %}" 
                    class="bg-red-500 text-white py-3 px-6 rounded-lg hover:bg-red-700 transition duration-300"
                >
                    Cancel
                </a>
                  
                </div>
            </div>
        </form>
    </section>

</main>

{% endblock content %}
