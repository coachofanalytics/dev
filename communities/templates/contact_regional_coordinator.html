{% extends "main/base_templates/base.html" %}

{% block content %}
<main class="py-16 px-6 bg-gray-100">

    <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-8">

        <h2 class="text-3xl font-semibold text-center mb-8 text-gray-800">Add a Message</h2>

        <form method="post">
            {% csrf_token %}
            
            <div class="space-y-6">

                <!-- Message Form Field -->
                <div>
                    <label for="message" class="block text-lg font-medium text-gray-700">Your Message</label>
                    <textarea name="message" id="message" rows="6" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-green focus:outline-none" placeholder="Type your message here">{{ form.message.value }}</textarea>
                    {% if form.message.errors %}
                        <ul class="mt-2 text-sm text-red-500">
                            {% for error in form.message.errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
                </div>

                <!-- Submit Button -->
                <div class="flex justify-between">
                    <button type="submit" class="bg-brand-green text-white py-3 px-6 rounded-lg hover:bg-[#086a4f] transition duration-300">
                        Save Message
                    </button>

                    <!-- Cancel Button -->
                    <a href="{% url 'home' %}" class="bg-gray-500 text-white py-3 px-6 rounded-lg hover:bg-gray-600 transition duration-300">
                        Cancel
                    </a>
                </div>

            </div>
        </form>

    </div>

</main>
{% endblock %}
