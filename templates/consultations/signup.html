{% extends "main/base_templates/base.html" %}
{% load static %}

{% block title %}Book a Consultation{% endblock %}

{% block content %}

<div class="container mt-3">
    <h2 class="text-primary" style="color: #0095ff; font-family: Arial, sans-serif; font-size: 30px; font-weight: bold;">Create new Account</h2>
    <form method="post" style="margin-top: 10px;width: 100%; max-width: 300px;">
        {% csrf_token %}
        <!-- Your form fields go here -->
        <div class="mb-1">
            <label for="id_name" class="form-label">First Name</label>
            <input type="text" name="firstname" class="form-control" id="id_name" placeholder=" Fill First Name" required>
        </div>
        <div class="mb-1">
            <label for="id_name" class="form-label">last  Name</label>
            <input type="text" name="lastname"  class="form-control" id="id_name" placeholder=" Fill Last Name" required>
        </div>
        <div class="mb-1">
            <label for="id_email" class="form-label">Email</label>
            <input type="email" name="email"  class="form-control" id="id_email"placeholder=" Fill Email" required>
        </div>
        <div class="mb-1">
            <label for="id_phone" class="form-label">Phone Numbers</label>
            <input type="text" name="phone"  class="form-control" id="id_phone" placeholder=" Fill Phone Number" required>
        </div>
         <div class="mb-1">
            <label for="password" class="form-label">Create Password</label>
            <input type="password" name="create_password" class="form-control" placeholder="Create New password" id="password" required>
        </div>
         <div class="mb-1">
            <label for="password" class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm New password" id="password" required>
        </div>
        <br>
        
      <div class="mb-3 form-check">
        <button type="submit" class="btn btn-danger">SignUp</button>
        <a href="/consultations/visa_applicationform/" class="btn btn-link"></a>
      </div>
    </form>
</div>
{% endblock %}
