<!DOCTYPE html>
<html>
    {% load static %}
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- <title>Welcome Email</title> -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <body>
        <div class="email-container" style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #35bdbd; padding-top: 10px; border-radius: 8px; padding: 20px;">
            <!-- Logo Section -->
            <div style="text-align: center;">
                <img src="https://dc48k.b-cdn.net/dc48k_logo.png" alt="DC48K Logo" style="width: 200px; height: auto;">
            </div>

            <!-- Greeting and Content -->
            <div class="content-box" style="padding: 20px; border: 1px solid #35bdbd; background-color: #f8f8f8; margin-top: 10px; border-radius: 8px; font-family: sans-serif; font-size: 18px;">
                <p>Greetings {{ first_name }} {{ last_name }},</p>
                <p>Congratulations and welcome to Diaspora County 48 Kenya.</p>
                <p>Your Membership Number is <strong>{{ user_id }}</strong>. Please keep it safe.</p>
                <p>Thank you,</p>
                <p>The DC48K Team</p>
            </div>
        </div>
    </body>
</html>
