{%extends "main/base_templates/new_base.html"%} 
{% load static %}
{% block content %}
    <div class="container">
        <h1>List of Files</h1>
        <ul>
            {% for file in files %}
                <li>
                    <a href="{% url 'upload_excel' file %}">{{ file }}</a>
                </li>
            {% empty %}
                <li>No files found.</li>
            {% endfor %}
        </ul>
    </div>
{% endblock content %}
