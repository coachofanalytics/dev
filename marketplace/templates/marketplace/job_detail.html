{% extends 'base.html' %}

{% block title %}{{ job.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <h1>{{ job.title }}</h1>
    <p class="lead">{{ job.description }}</p>
    <p>Location: {{ job.location }}</p>
    {% if job.salary_min %}
    <p>Salary: ${{ job.salary_min }} - ${{ job.salary_max }}</p>
    {% endif %}
    <a href="{% url 'marketplace:browse_jobs' %}" class="btn btn-secondary">Back to Jobs</a>
</div>
{% endblock %}
